<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Lamp Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --lamp-color: #eee9d8;
            --lamp-dark: #bcb79f;
            --gold: #d9ae4b;
            --background: #050607;
            --card: rgba(25, 26, 29, 0.75);
            --text: #f3f3f3;
            --muted: #777;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow: hidden;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at 25% 50%,
                    rgba(190, 170, 110, 0.08),
                    transparent 35%
                ),
                #050607;

            color: var(--text);
        }

        /* =========================
           MAIN SCENE
        ========================= */

        .scene {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015),
                    transparent 50%,
                    rgba(255,255,255,0.01)
                );
        }

        /* =========================
           ROOM LIGHT
        ========================= */

        .room-light {
            position: absolute;

            width: 800px;
            height: 800px;

            left: 10%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 214, 120, 0.22),
                    rgba(255, 193, 75, 0.09) 25%,
                    transparent 65%
                );

            filter: blur(20px);

            opacity: 0;

            transition:
                opacity 0.8s ease,
                transform 1s ease;
        }

        .scene.on .room-light {
            opacity: 1;
        }

        /* =========================
           LAMP
        ========================= */

        .lamp {
            position: absolute;

            left: 22%;
            top: 50%;

            width: 230px;
            height: 440px;

            transform: translate(-50%, -50%);

            z-index: 5;
        }

        /* Large ambient glow */

        .lamp-glow {
            position: absolute;

            width: 500px;
            height: 500px;

            left: 50%;
            top: 15%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 211, 112, 0.28),
                    rgba(255, 191, 76, 0.12) 25%,
                    transparent 68%
                );

            filter: blur(30px);

            opacity: 0;

            pointer-events: none;

            transition: opacity 0.7s ease;
        }

        .scene.on .lamp-glow {
            opacity: 1;
        }

        /* =========================
           SHADE
        ========================= */

        .shade {
            position: absolute;

            top: 35px;
            left: 50%;

            width: 190px;
            height: 105px;

            transform: translateX(-50%);

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #eeeadd 70%,
                    #d0c9b3 100%
                );

            border-radius:
                100px 100px 18px 18px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.5);

            z-index: 10;
        }

        .shade::before {
            content: "";

            position: absolute;

            left: 50%;
            top: -7px;

            transform: translateX(-50%);

            width: 17px;
            height: 9px;

            border-radius: 8px 8px 2px 2px;

            background: #aaa58e;
        }

        .shade::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: -4px;

            transform: translateX(-50%);

            width: 170px;
            height: 9px;

            border-radius: 50%;

            background: #c6c0a9;
        }

        /* =========================
           BULB
        ========================= */

        .bulb {
            position: absolute;

            left: 50%;
            top: 90px;

            transform: translateX(-50%);

            width: 25px;
            height: 38px;

            border-radius:
                50% 50% 45% 45%;

            background: #e7dfc4;

            box-shadow:
                0 0 0 rgba(255, 211, 104, 0);

            z-index: 7;

            transition:
                background 0.5s ease,
                box-shadow 0.5s ease;
        }

        .scene.on .bulb {
            background: #ffd878;

            box-shadow:
                0 0 10px #ffd878,
                0 0 30px rgba(255, 208, 95, 0.9),
                0 0 70px rgba(255, 188, 64, 0.7);
        }

        /* =========================
           LAMP STEM
        ========================= */

        .stem {
            position: absolute;

            left: 50%;
            top: 125px;

            transform: translateX(-50%);

            width: 11px;
            height: 245px;

            border-radius: 8px;

            background:
                linear-gradient(
                    90deg,
                    #9f9a83,
                    #f3eedc,
                    #aaa58d
                );

            z-index: 6;
        }

        /* =========================
           BASE
        ========================= */

        .base {
            position: absolute;

            left: 50%;
            bottom: 25px;

            transform: translateX(-50%);

            width: 115px;
            height: 17px;

            border-radius: 50%;

            background:
                linear-gradient(
                    180deg,
                    #f0ead7,
                    #aaa48d
                );

            box-shadow:
                0 8px 20px rgba(0,0,0,0.6);

            z-index: 8;
        }

        .base::after {
            content: "";

            position: absolute;

            left: 50%;
            top: -7px;

            transform: translateX(-50%);

            width: 65px;
            height: 10px;

            border-radius: 50%;

            background: #d4ceb9;
        }

        /* =========================
           PULL CORD
        ========================= */

        .cord {
            position: absolute;

            left: calc(50% + 32px);
            top: 100px;

            width: 2px;
            height: 70px;

            background: #777366;

            transform-origin: top;

            z-index: 12;

            transition: transform 0.2s ease;
        }

        .cord-handle {
            position: absolute;

            bottom: -18px;
            left: 50%;

            transform: translateX(-50%);

            width: 15px;
            height: 25px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #f3c867,
                    #a77a27
                );

            box-shadow:
                0 0 8px rgba(255, 198, 82, 0.3);

            cursor: pointer;
        }

        .cord.pull {
            transform: rotate(7deg);
        }

        /* =========================
           SWITCH
        ========================= */

        .switch {
            position: absolute;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #d4cba8;

            cursor: pointer;

            z-index: 20;

            box-shadow:
                0 0 0 4px rgba(255,255,255,0.03);
        }

        /* =========================
           DUST PARTICLES
        ========================= */

        .dust {
            position: absolute;

            inset: 0;

            pointer-events: none;

            overflow: hidden;

            z-index: 4;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: rgba(255, 220, 150, 0.7);

            opacity: 0;

            animation:
                floatParticle
                linear infinite;
        }

        .scene.on .particle {
            opacity: 1;
        }

        @keyframes floatParticle {

            0% {
                transform:
                    translateY(30px)
                    translateX(0);

                opacity: 0;
            }

            15% {
                opacity: 0.8;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform:
                    translateY(-180px)
                    translateX(30px);

                opacity: 0;
            }
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .login {
            position: absolute;

            left: 64%;
            top: 50%;

            transform:
                translate(-50%, -50%)
                translateY(20px);

            width: 340px;

            padding: 34px;

            border-radius: 22px;

            background:
                rgba(22, 23, 26, 0.72);

            border:
                1px solid rgba(255,255,255,0.07);

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px rgba(0,0,0,0.55);

            opacity: 0;

            transition:
                opacity 1s ease,
                transform 1s ease;

            z-index: 30;
        }

        .scene.on .login {
            opacity: 1;

            transform:
                translate(-50%, -50%)
                translateY(0);
        }

        .login h1 {
            font-size: 27px;

            margin-bottom: 8px;

            font-weight: 600;
        }

        .login p {
            font-size: 13px;

            color: #707070;

            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;

            font-size: 11px;

            color: #858585;

            margin-bottom: 7px;
        }

        .field input {
            width: 100%;

            height: 43px;

            padding: 0 13px;

            border-radius: 10px;

            border:
                1px solid rgba(255,255,255,0.07);

            outline: none;

            color: white;

            background:
                rgba(255,255,255,0.035);

            transition:
                border 0.2s ease,
                background 0.2s ease;
        }

        .field input:focus {
            border-color:
                rgba(222, 178, 76, 0.7);

            background:
                rgba(255,255,255,0.06);
        }

        .options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin: 8px 0 20px;

            font-size: 11px;

            color: #707070;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 6px;
        }

        .remember input {
            accent-color: #d6ae54;
        }

        .forgot {
            color: #9c8a61;

            cursor: pointer;
        }

        .login-btn {
            width: 100%;

            height: 44px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            color: #211b0d;

            font-size: 13px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #d7b359,
                    #a98232
                );

            box-shadow:
                0 5px 20px rgba(188, 146, 51, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 28px rgba(188, 146, 51, 0.3);
        }

        .signup {
            margin-top: 18px;

            text-align: center;

            color: #666;

            font-size: 11px;
        }

        .signup span {
            color: #b99a5b;

            cursor: pointer;
        }

        /* =========================
           INITIAL STATE
        ========================= */

        .scene:not(.on) .lamp {
            filter: brightness(0.72);
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            body {
                overflow-y: auto;
            }

            .scene {
                min-height: 100vh;

                flex-direction: column;
            }

            .lamp {
                left: 50%;
                top: 35%;

                transform:
                    translate(-50%, -50%)
                    scale(0.75);
            }

            .room-light {
                left: 50%;
                top: 35%;
            }

            .login {
                left: 50%;
                top: 72%;

                width: calc(100% - 40px);

                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <main class="scene" id="scene">

        <!-- Ambient Room Light -->
        <div class="room-light"></div>

        <!-- =========================
             DUST
        ========================== -->

        <div class="dust" id="dust"></div>

        <!-- =========================
             LAMP
        ========================== -->

        <div class="lamp">

            <div class="lamp-glow"></div>

            <div class="shade"></div>

            <div class="bulb"></div>

            <div class="stem"></div>

            <div class="base"></div>

            <!-- Pull Cord -->
            <div class="cord" id="cord">
                <div class="cord-handle"></div>
            </div>

            <!-- Hidden switch -->
            <div
                class="switch"
                id="switch"
                title="Turn lamp on/off">
            </div>

        </div>

        <!-- =========================
             LOGIN
        ========================== -->

        <section class="login">

            <h1>Welcome</h1>

            <p>
                Sign in to continue your journey.
            </p>

            <form id="loginForm">

                <div class="field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>

                <div class="field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="••••••••"
                        required
                    >

                </div>

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <span class="forgot">
                        Forgot password?
                    </span>

                </div>

                <button
                    type="submit"
                    class="login-btn">
                    Sign In
                </button>

            </form>

            <div class="signup">

                Don't have an account?

                <span>
                    Sign Up
                </span>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           ELEMENTS
        ========================== */

        const scene =
            document.getElementById("scene");

        const cord =
            document.getElementById("cord");

        const switchButton =
            document.getElementById("switch");

        const loginForm =
            document.getElementById("loginForm");

        const dust =
            document.getElementById("dust");


        /* =========================
           LAMP STATE
        ========================== */

        let lampOn = false;


        function toggleLamp() {

            lampOn = !lampOn;

            scene.classList.toggle(
                "on",
                lampOn
            );

            if (lampOn) {

                cord.classList.add("pull");

                setTimeout(() => {

                    cord.classList.remove("pull");

                }, 180);

            }

        }


        /* =========================
           CORD CLICK
        ========================== */

        cord.addEventListener(
            "click",
            toggleLamp
        );


        /* =========================
           SWITCH CLICK
        ========================== */

        switchButton.addEventListener(
            "click",
            toggleLamp
        );


        /* =========================
           KEYBOARD
        ========================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.code === "Space" ||
                    event.key === "l" ||
                    event.key === "L"
                ) {

                    event.preventDefault();

                    toggleLamp();

                }

            }
        );


        /* =========================
           CREATE DUST PARTICLES
        ========================== */

        for (let i = 0; i < 45; i++) {

            const particle =
                document.createElement("span");

            particle.className =
                "particle";

            const left =
                10 + Math.random() * 40;

            const top =
                35 + Math.random() * 45;

            const size =
                1 + Math.random() * 3;

            const duration =
                4 + Math.random() * 7;

            const delay =
                Math.random() * 7;

            particle.style.left =
                left + "%";

            particle.style.top =
                top + "%";

            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";

            particle.style.animationDuration =
                duration + "s";

            particle.style.animationDelay =
                delay + "s";

            dust.appendChild(
                particle
            );

        }


        /* =========================
           LOGIN
        ========================== */

        loginForm.addEventListener(
            "submit",
            event => {

                event.preventDefault();

                const email =
                    document.getElementById(
                        "email"
                    ).value;

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                if (!email || !password) {

                    return;

                }

                alert(
                    `Welcome ${email}`
                );

            }
        );


        /* =========================
           START ANIMATION
        ========================== */

        window.addEventListener(
            "load",
            () => {

                setTimeout(
                    () => {

                        toggleLamp();

                    },
                    700
                );

            }
        );

    </script>

    <script>
        /* Clear old PWA service worker + caches
           so the new version always loads fresh */
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .getRegistrations()
                .then(function (registrations) {
                    registrations.forEach(function (registration) {
                        registration.unregister();
                    });
                });
        }

        if (window.caches) {
            caches.keys().then(function (keys) {
                keys.forEach(function (key) {
                    caches.delete(key);
                });
            });
        }
    </script>

</body>
</html>
